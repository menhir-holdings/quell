<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Quell — chained OLL and PLL flashcards." />
    <title>Quell — OLL / PLL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,14..144,600;1,14..144,400&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <header class="hero">
        <div>
          <h1>Quell</h1>
          <nav id="sets" class="mode-tabs" aria-label="Set"></nav>
        </div>
        <div class="hero-end">
          <p class="hero-meta" id="status"></p>
          <div class="overflow">
            <button
              type="button"
              id="btn-menu"
              class="icon-btn"
              aria-haspopup="menu"
              aria-expanded="false"
              aria-controls="menu"
              aria-label="Menu"
            >
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path
                  d="M4 7h16M4 12h16M4 17h16"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />
              </svg>
            </button>
            <div id="menu" class="menu" hidden role="menu">
              <p class="menu-kicker">Accounts</p>
              <div id="account-list"></div>
              <button type="button" role="menuitem" id="btn-new-account">
                New account
              </button>
            </div>
          </div>
        </div>
      </header>

      <section class="stage" id="stage">
        <div class="cube-card">
          <div id="ll-diagram" class="ll-diagram"></div>
          <div id="player-host" class="player-host" hidden></div>
          <nav id="view-tabs" class="view-tabs" aria-label="Cube view"></nav>
        </div>

        <p id="case-name" class="case-name" hidden></p>
        <input
          id="name-edit"
          class="name-edit"
          type="text"
          maxlength="40"
          autocomplete="off"
          hidden
          aria-label="Case name"
        />

        <button type="button" id="alg-card" class="solve-card" aria-expanded="false">
          <span class="solve-kicker">Alg</span>
          <span id="alg-body" class="solve-body">Tap to reveal</span>
        </button>

        <button type="button" id="check-card" class="solve-card" aria-expanded="false">
          <span class="solve-kicker">After this alg</span>
          <span id="check-body" class="solve-body">Tap to check the cube</span>
        </button>

        <div class="actions">
          <button type="button" id="btn-next" class="pill primary">Next</button>
        </div>
      </section>

      <section class="account-page" id="account-page" hidden>
        <button type="button" id="account-back" class="text-back">Back</button>
        <h2>Account</h2>
        <label class="field">
          <span>Name</span>
          <input
            id="account-name"
            type="text"
            maxlength="32"
            autocomplete="off"
            spellcheck="false"
          />
        </label>
        <button type="button" id="btn-delete-account" class="danger-link">
          Delete account
        </button>
      </section>
    </div>

    <dialog id="name-dialog" class="confirm-dialog">
      <form method="dialog" class="confirm-form" id="name-form">
        <h2>Name this case</h2>
        <p>You’ll see this name the next time it comes up.</p>
        <input
          id="name-dialog-input"
          type="text"
          maxlength="40"
          placeholder="e.g. sune fish, T"
          autocomplete="off"
          required
        />
        <button type="submit" value="save" id="btn-save-name" class="pill primary" disabled>
          Save
        </button>
        <button type="button" value="cancel" class="dialog-cancel">Cancel</button>
      </form>
    </dialog>

    <dialog id="account-dialog" class="confirm-dialog">
      <form method="dialog" class="confirm-form" id="account-form">
        <h2>New account</h2>
        <p>Names stay on this account. Switching does not mix them.</p>
        <input
          id="account-dialog-input"
          type="text"
          maxlength="32"
          placeholder="e.g. Phil, practice cube"
          autocomplete="off"
          required
        />
        <button type="submit" value="save" id="btn-save-account" class="pill primary" disabled>
          Create
        </button>
        <button type="button" value="cancel" class="dialog-cancel">Cancel</button>
      </form>
    </dialog>

    <dialog id="delete-dialog" class="confirm-dialog">
      <form method="dialog" class="confirm-form" id="delete-form">
        <h2 id="delete-title">Delete this account?</h2>
        <p id="delete-copy">
          Case names on this account go with it. This cannot be undone.
        </p>
        <button type="submit" value="delete" class="pill danger">Delete account</button>
        <button type="button" value="cancel" class="dialog-cancel">Cancel</button>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
