<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Quell — learn and practice full OLL and PLL."
    />
    <title>Quell — OLL / PLL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,14..144,600;1,14..144,400&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <header class="hero">
        <div>
          <h1>Quell</h1>
          <p class="tagline">Learn the cases. Practice the ones you keep.</p>
          <nav id="sets" class="mode-tabs" aria-label="Set"></nav>
          <nav id="phases" class="mode-tabs" aria-label="Phase"></nav>
        </div>
        <p class="hero-meta" id="status"></p>
      </header>

      <section class="filters" id="filters" aria-label="View and submode"></section>

      <p id="empty" class="empty" hidden></p>

      <section class="stage" id="stage">
        <div class="cube-card">
          <div id="ll-diagram" class="ll-diagram"></div>
          <div id="player-host" class="player-host" hidden></div>
          <nav id="view-tabs" class="view-tabs" aria-label="Cube view"></nav>
        </div>
        <div class="meta">
          <p id="case-label" class="case-label"></p>
          <p id="case-sub" class="case-sub"></p>
          <label class="name-field">
            <span>Your name for this case</span>
            <input
              id="custom-name"
              type="text"
              maxlength="40"
              placeholder="e.g. headlights, sune fish, T"
              autocomplete="off"
            />
          </label>
          <p class="scramble-kicker" id="setup-kicker">Setup</p>
          <pre id="setup" class="scramble"></pre>
          <button type="button" id="solve-card" class="solve-card" aria-expanded="false">
            <span class="solve-kicker">Solve</span>
            <span id="solve-body" class="solve-body">Tap to reveal</span>
          </button>
          <div class="actions">
            <button type="button" id="btn-next" class="pill primary" hidden>
              Next
            </button>
            <button type="button" id="btn-learned" class="learned" aria-pressed="false">
              Learned
            </button>
          </div>
        </div>
      </section>

      <section id="grid-wrap" class="grid-wrap" hidden>
        <h2 id="grid-title">Cases</h2>
        <p class="section-lead" id="grid-lead"></p>
        <div id="grid" class="case-grid"></div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
